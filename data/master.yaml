basics:
  name: "Zakhar Dolozhevskiy"
  headline: "Senior / Staff Full-Stack Engineer | AI Automation & Cloud Microservices | TypeScript, React, Angular, Node.js, AWS, Kafka"
  summary: |
    Staff / Senior Full-Stack Engineer with 13+ years of experience (since 2013) engineering high-scale platforms across media streaming, e-commerce, travel, and real-time communication. Proven track record of delivering business-critical systems at companies ranging from fast-growing startups to tech giants like Microsoft and Byborg.

    Currently driving organization-wide AI adoption beyond basic code completion. I build integrate agentic workflows, and establish "golden path" scenarios for Engineering, QA, and Management to systematically elevate development velocity and system quality.

    Core Value & Leadership:

    Complex Problem Solving: I take ownership of the hardest parts of the system, stepping in when teams are blocked and fixing root-cause production issues.

    Platform Stability & Tech Strategy: Drive architectural refactoring, reduce technical debt, and ensure high performance under scale.

    Culture & Mentorship: Elevate engineering standards through continuous knowledge sharing, code quality initiatives, and cross-team alignment.
  location: "Remote"
  email: "dolozhevskiy@gmail.com"
  phone: null
  links:
    - { label: "LinkedIn", url: "https://linkedin.com/in/zakhardolozhevskiy" }
    - { label: "GitHub", url: "https://github.com/ZakharDolozhevskiy" }

