recommendations:
  - author: "Andrei Bunulu"
    author_title: "Staff AI Full Stack Engineer | AI Transformation | High-Scale Streaming & SaaS | React, TypeScript, Node.js"
    relationship: "Worked with Zakhar on the same team"
    date: "2026-03-31"
    text: |
      I'd highly recommend Zakhar for any senior or staff-level frontend engineering role. He's the kind of engineer you want on your most important projects. Whether it was evaluating new technologies, sharing knowledge across teams, or contributing to engineering process improvements like AI-assisted code review workflows, he consistently raised the bar for everyone around him.
  - author: "Valter Kungla"
    author_title: "Senior Engineering Manager at Katana, ex-Twilio, ex-Pipedrive, Certified Team Coach, Founder of RoleDream.com"
    relationship: "Managed Zakhar directly"
    date: "2020-11-09"
    text: |
      Zakhar is quite unique person - he solved all the engineering initiatives with ease and high quality. I mostly hear about him, when things were are already solved.
      He is a good team player, hard worker and top of the class engineer.
      Cooperation with you was awesome, thank you!
  - author: "Oksana Spolnyk"
    author_title: "Frontend Team Lead | React · TypeScript · Frontend Architecture"
    relationship: "Worked with Zakhar on the same team"
    date: "2018-10-15"
    text: |
      I had been working with Zakhar about 3 years in different companies and it was a great time working on the same project!

      I was particularly impressed by Zakhar's ability to handle even the toughest tasks using not well documented and specific technologies. He was a good mentor when I came to the project and helped integrate into the development process quickly. He is ready to be the friendly shoulder in any difficult situation and give good ideas.

      Hope to work together again :)
